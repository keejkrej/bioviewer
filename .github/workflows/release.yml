name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p bioviewer-core --locked
      - name: Build
        run: cargo build -p bioviewer --release --locked
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/bioviewer.exe
          generate_release_notes: true

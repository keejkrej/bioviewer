name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows NSIS
            os: windows-latest
            artifact: windows
          - name: macOS DMG
            os: macos-latest
            artifact: macos
          - name: Linux deb
            os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libvulkan-dev
      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build -p bioviewer --release --locked
      - name: NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          choco install nsis --no-progress -y
          New-Item -ItemType Directory -Force dist | Out-Null
          $product = "0.0.0.0"
          if ($env:VERSION -match '^(\d+)\.(\d+)\.(\d+)') {
            $product = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          }
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "C:\Program Files\NSIS\makensis.exe"
          }
          & $makensis "/DVERSION=$env:VERSION" "/DPRODUCTVERSION=$product" packaging/nsis/bioviewer.nsi
      - name: DMG
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh "${{ steps.version.outputs.version }}"
      - name: Debian package
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bioviewer-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
